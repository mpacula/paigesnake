<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snake">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Paige's Snake</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;
    font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;width:100%;height:100%}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;background:rgba(10,30,50,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#fff;text-align:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top))}
  .hidden{display:none !important}
  h1{font-size:clamp(34px,7vw,68px);margin:0;text-shadow:0 4px 18px rgba(0,0,0,.4)}
  .cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .card{width:128px;padding:18px 10px;border-radius:22px;background:rgba(255,255,255,.14);
    border:3px solid transparent;font-size:20px;font-weight:700;cursor:pointer}
  .card .emoji{font-size:56px;display:block}
  .card.sel{border-color:#ffd34a;background:rgba(255,255,255,.28)}
  .row{font-size:20px;display:flex;align-items:center;gap:12px}
  input[type=range]{width:220px}
  .btn{font-size:28px;font-weight:800;padding:16px 56px;border-radius:999px;border:0;background:#ffd34a;
    color:#2b2100;box-shadow:0 6px 0 #c9a21d;cursor:pointer}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9a21d}
  .btn.secondary{background:rgba(255,255,255,.2);color:#fff;box-shadow:none;font-size:20px;padding:12px 32px}
  #hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;
    gap:28px;color:#fff;font-weight:800;font-size:22px;text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none}
  #mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:14px;font-size:26px;background:rgba(0,0,0,.25);
    border:0;border-radius:999px;width:48px;height:48px;color:#fff;pointer-events:auto;cursor:pointer}
  #fire{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:104px;height:104px;
    border-radius:999px;border:4px solid rgba(255,255,255,.7);background:rgba(255,120,40,.75);color:#fff;font-size:38px;font-weight:800;
    pointer-events:auto;cursor:pointer;box-shadow:0 0 24px rgba(255,140,40,.6);touch-action:none;-webkit-user-select:none;user-select:none}
  #fire small{display:block;font-size:16px;margin-top:-4px}
  .hint{opacity:.85;font-size:17px;max-width:440px;line-height:1.4}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <span>🍎 <b id="score">0</b></span>
  <span>📏 <b id="len">6</b></span>
  <span>🐍 <b id="alive">0</b></span>
</div>
<button id="mute" class="hidden" aria-label="Toggle music">🔊</button>
<button id="fire" class="hidden" aria-label="Fire">🔫<small id="fireT">15</small></button>

<div id="menu" class="overlay">
  <h1>🐍 Paige's Snake</h1>
  <div class="cards">
    <div class="card sel" data-world="forest"><span class="emoji">🌲</span>Forest</div>
    <div class="card" data-world="beach"><span class="emoji">🏖️</span>Beach</div>
    <div class="card" data-world="space"><span class="emoji">🚀</span>Space</div>
  </div>
  <div class="row"><label for="cpu">Other snakes</label><input id="cpu" type="range" min="0" max="10" value="4"><b id="cpuVal">4</b></div>
  <div class="row"><label><input id="musicOn" type="checkbox" checked> Music</label></div>
  <button id="play" class="btn">Play</button>
  <p class="hint">Touch the left or right side of the screen to turn. Touch both sides to go fast.
    Eat snacks to grow. Bump another snake's body with your head to eat it!
    Grab a 🔫 blaster and hold the fire button to zap other snakes.</p>
</div>

<div id="over" class="overlay hidden">
  <h1>Yum! You got eaten 😋</h1>
  <div class="row" id="finalScore"></div>
  <button id="again" class="btn">Play again</button>
  <button id="toMenu" class="btn secondary">Change world</button>
</div>

<script type="module">
import * as THREE from './vendor/three.module.min.js';

// ---------------- config ----------------
const R = 95;                // playable radius
const TERRAIN_SIZE = 360;
const SEG_SPACING = 1.0, SEG_R = 0.95, HEAD_R = 1.2, MAX_SEG = 400, START_LEN = 6;
const FOOD_COUNT = 45;
const PLAYER_SPEED = 14, CPU_SPEED = 11.5, TURN_RATE = 2.6;
const WORLDS = {
  forest: { sky: 0x9fd3ff, fog: 0xb4dcf5, fogNear: 70, fogFar: 240, hemiSky: 0xcfe8ff, hemiGround: 0x3f6b2a },
  beach:  { sky: 0x7ec8ff, fog: 0xd2ebff, fogNear: 90, fogFar: 270, hemiSky: 0xdff2ff, hemiGround: 0xc9b57a },
  space:  { sky: 0x05030f, fog: 0x0b0718, fogNear: 60, fogFar: 210, hemiSky: 0x5a4fa0, hemiGround: 0x1a1424 },
};
const CPU_COLORS = [0xff8c42, 0x9b5de5, 0x3a86ff, 0xff5d8f, 0x2ec4b6, 0xffd166, 0xef476f, 0x8d6e63, 0x06d6a0, 0xf4a261];

// ---------------- state ----------------
let world = 'forest', cpuCount = 4, seed = 0;
let scene, camera, renderer, clock;
let snakes = [], foods = [], player = null;
let state = 'menu', score = 0, time = 0;
let waterMesh = null, cloudMesh = null, pools = [], craters = [], ufos = [];

// ---------------- noise / terrain ----------------
function hash(ix, iz) {
  let n = (Math.imul(ix, 374761393) + Math.imul(iz, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  const top = a + (b - a) * sx, bot = c + (d - c) * sx;
  return top + (bot - top) * sz;
}
function fbm(x, z) { // -0.5 .. 0.5
  let v = 0, amp = 0.5, f = 1, sum = 0;
  for (let i = 0; i < 4; i++) { v += vnoise(x * f, z * f) * amp; sum += amp; amp *= 0.5; f *= 2.1; }
  return v / sum - 0.5;
}
function heightAt(x, z) {
  const r = Math.hypot(x, z);
  if (world === 'forest') {
    let h = fbm(x * 0.022 + seed, z * 0.022 + seed) * 7;
    if (r > R) { const t = (r - R) / 40; h += t * t * 45; }
    return h;
  }
  if (world === 'space') {
    let h = fbm(x * 0.03 + seed, z * 0.03 + seed) * 5;
    for (const c of craters) {
      const d = Math.hypot(x - c.x, z - c.z) / c.r;
      if (d < 1.25) {
        if (d < 1) h -= (1 - d * d) * c.depth;
        const rim = 1 - Math.abs(d - 1) / 0.25; if (rim > 0) h += rim * c.depth * 0.35;
      }
    }
    if (r > R) { const t = (r - R) / 35; h += t * t * 40; }
    return h;
  }
  let h = 2.2 + fbm(x * 0.02 + seed, z * 0.02 + seed) * 3;
  const r0 = R * 0.92;
  if (r > r0) { const t = (r - r0) / 18; h -= Math.pow(t, 1.4) * 7; }
  return h;
}
const tmpC = new THREE.Color();
function groundColor(x, z, h, c) {
  const n = fbm(x * 0.08 + 7, z * 0.08 + 3) + 0.5;
  if (world === 'forest') {
    c.setRGB(0.32, 0.58, 0.19).lerp(tmpC.setRGB(0.17, 0.40, 0.12), n);
    if (h > 10) c.lerp(tmpC.setRGB(0.45, 0.42, 0.38), Math.min(1, (h - 10) / 14));
    if (h > 26) c.lerp(tmpC.setRGB(0.95, 0.96, 1.0), Math.min(1, (h - 26) / 8));
  } else if (world === 'space') {
    c.setRGB(0.60, 0.57, 0.68).lerp(tmpC.setRGB(0.38, 0.34, 0.48), n);
    if (h < -1) c.lerp(tmpC.setRGB(0.20, 0.17, 0.28), Math.min(1, (-1 - h) / 5));
    if (h > 14) c.lerp(tmpC.setRGB(0.30, 0.27, 0.38), Math.min(1, (h - 14) / 20));
  } else {
    c.setRGB(0.96, 0.88, 0.65).lerp(tmpC.setRGB(0.88, 0.78, 0.55), n);
    if (h < 1.0) c.lerp(tmpC.setRGB(0.72, 0.64, 0.45), Math.min(1, (1.0 - h) / 1.5));
    if (h < -0.5) c.lerp(tmpC.setRGB(0.35, 0.55, 0.5), Math.min(1, (-0.5 - h) / 3));
  }
}

// ---------------- procedural textures ----------------
function makeTex(size, fn, repeat) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d'); const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const i = (y * size + x) * 4; const [r, g, b] = fn(x, y, size);
    img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const TAU = Math.PI * 2;
const groundTex = makeTex(256, (x, y, s) => {
  const v = 220 + (Math.random() - 0.5) * 44 + Math.sin(x / s * TAU * 2 + 1.3) * Math.sin(y / s * TAU * 3) * 3;
  return [v, v, v];
}, 48);
const barkTex = makeTex(128, (x, y, s) => {
  const v = 180 + Math.sin(x / s * TAU * 6) * 30 + Math.sin(x / s * TAU * 13 + y * 0.1) * 15 + (Math.random() - 0.5) * 40;
  return [v, v, v];
}, 1);
const waterTex = makeTex(256, (x, y, s) => {
  const v = 232 + Math.sin(x / s * TAU * 4 + Math.sin(y / s * TAU * 3) * 2) * 14 + (Math.random() - 0.5) * 10;
  return [v, v, v + 10];
}, 40);

const lavaTex = makeTex(128, (x, y, s) => {
  const a = Math.sin(x / s * TAU * 3) * Math.sin(y / s * TAU * 2) + Math.sin((x + y) / s * TAU * 4) * 0.5 + (Math.random() - 0.5) * 0.3;
  const t = Math.min(1, Math.max(0, (a + 1.5) / 3));
  return [255, 50 + t * 170, t * t * 60];
}, 3);
const lavaMat = new THREE.MeshBasicMaterial({ map: lavaTex });
const fireMats = [new THREE.MeshBasicMaterial({ color: 0xff6a00 }), new THREE.MeshBasicMaterial({ color: 0xffd23a }), new THREE.MeshBasicMaterial({ color: 0xff2e00 })];
const fireGeo = new THREE.ConeGeometry(0.45, 1.5, 5);

// ---------------- shared geometry / materials ----------------
const frondGeo = (() => {
  const g = new THREE.PlaneGeometry(1.5, 5, 1, 8);
  g.rotateX(-Math.PI / 2); g.translate(0, 0, 2.5);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const t = p.getZ(i) / 5; p.setY(i, -t * t * 2.4); p.setX(i, p.getX(i) * (1 - 0.6 * t)); }
  g.computeVertexNormals();
  return g;
})();
const palmTrunkGeo = new THREE.TubeGeometry(
  new THREE.QuadraticBezierCurve3(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.3, 4.5, 0), new THREE.Vector3(2.2, 8, 0)),
  10, 0.38, 7, false);
const GEO = {
  cone: new THREE.ConeGeometry(1, 1, 7), cyl: new THREE.CylinderGeometry(0.8, 1, 1, 7),
  ico: new THREE.IcosahedronGeometry(1, 1), ico0: new THREE.IcosahedronGeometry(1, 0),
  dodec: new THREE.DodecahedronGeometry(1, 0), sphere: new THREE.SphereGeometry(1, 10, 8),
  box: new THREE.BoxGeometry(1, 1, 1), tuft: new THREE.ConeGeometry(1, 1, 4),
  frond: frondGeo, palmTrunk: palmTrunkGeo, octa: new THREE.OctahedronGeometry(1, 0),
};
const lam = (color, extra = {}) => new THREE.MeshLambertMaterial({ color, ...extra });
const MAT = {
  bark: lam(0x9c6b48, { map: barkTex }), pine: lam(0x2f7a3a, { flatShading: true }), pine2: lam(0x3d8f46, { flatShading: true }),
  leaf: lam(0x4caf50, { flatShading: true }), bush: lam(0x3d8b40, { flatShading: true }), bushBeach: lam(0x5c9e4a, { flatShading: true }),
  rock: lam(0x8a8a8a, { flatShading: true }), lavaRock: lam(0x3a2f2c, { flatShading: true }), grass: lam(0x7fbf4a), grassBeach: lam(0xc2cf7d),
  mushStem: lam(0xf1e8d8), mushCap: lam(0xd84a3a), palmLeaf: lam(0x3fa34d, { side: THREE.DoubleSide }),
  coco: lam(0x6b4a2b), pole: lam(0xf2f2f2), shell: lam(0xf7dcd0), shell2: lam(0xf5c6a5), star: lam(0xff8a5b),
  cloud: lam(0xffffff), umb0: lam(0xff5a5a), umb1: lam(0x4a90ff), umb2: lam(0xffd34a),
  towel0: lam(0x4ad4ff), towel1: lam(0xff9ad5), towel2: lam(0xc6ff7a),
  moonRock: lam(0x6e6880, { flatShading: true }),
  crystalA: lam(0x7df9ff, { emissive: 0x1fb8c8, flatShading: true }), crystalB: lam(0xff7bf2, { emissive: 0xb0309f, flatShading: true }),
  stalk: lam(0x8fd0ff), bulb: lam(0xa8ff6a, { emissive: 0x5fd622 }),
  ufo: lam(0xb8bcc8, { flatShading: true }), dome: lam(0x9fd8ff, { emissive: 0x2a6fb0, transparent: true, opacity: 0.75 }),
  ufoLight: lam(0xffd34a, { emissive: 0xffaa00 }), rocketBody: lam(0xf0f0f0), rocketNose: lam(0xff4d4d), flagPole: lam(0xdddddd), flag: lam(0x3a86ff),
  helmet: new THREE.MeshPhongMaterial({ color: 0xa8dcff, transparent: true, opacity: 0.3, shininess: 140, specular: 0xffffff, depthWrite: false }),
  suit: lam(0xf4f4f8), pack: lam(0xc9ccd6),
};

// ---------------- instancing collector ----------------
const buckets = new Map();
function part(group, geoKey, matKey, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(GEO[geoKey], MAT[matKey]);
  m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.rotation.set(rx, ry, rz);
  m.userData.key = geoKey + '|' + matKey; group.add(m); return m;
}
function collect(group) {
  group.updateMatrixWorld(true);
  group.traverse(o => {
    if (!o.isMesh || !o.userData.key) return;
    let b = buckets.get(o.userData.key);
    if (!b) { b = { geo: o.geometry, mat: o.material, mats: [] }; buckets.set(o.userData.key, b); }
    b.mats.push(o.matrixWorld.clone());
  });
}
function flushBuckets() {
  const out = new Map();
  for (const [key, b] of buckets) {
    const im = new THREE.InstancedMesh(b.geo, b.mat, b.mats.length);
    b.mats.forEach((m, i) => im.setMatrixAt(i, m));
    im.frustumCulled = false; scene.add(im); out.set(key, im);
  }
  buckets.clear(); return out;
}
const rnd = (a, b) => a + Math.random() * (b - a);
function placeGroup(x, z, scale, yOff = 0) {
  const g = new THREE.Group();
  g.position.set(x, heightAt(x, z) + yOff, z); g.rotation.y = Math.random() * TAU; g.scale.setScalar(scale);
  return g;
}
function randomXZ(rmin, rmax) {
  const a = Math.random() * TAU, r = Math.sqrt(rnd(rmin * rmin, rmax * rmax));
  return [Math.sin(a) * r, Math.cos(a) * r];
}

// ---------------- world object prototypes ----------------
const PROTO = {
  pine(g) {
    part(g, 'cyl', 'bark', 0, 1.1, 0, 0.35, 2.2, 0.35);
    const m = Math.random() < 0.5 ? 'pine' : 'pine2';
    part(g, 'cone', m, 0, 3.0, 0, 2.3, 3.2, 2.3);
    part(g, 'cone', m, 0, 4.9, 0, 1.8, 3.0, 1.8);
    part(g, 'cone', m, 0, 6.6, 0, 1.25, 2.6, 1.25);
  },
  roundTree(g) {
    part(g, 'cyl', 'bark', 0, 1.5, 0, 0.4, 3, 0.4);
    part(g, 'ico', 'leaf', 0, 4.4, 0, 2.4, 2.2, 2.4);
    part(g, 'ico', 'leaf', 1.3, 3.6, 0.6, 1.5, 1.3, 1.5);
    part(g, 'ico', 'leaf', -1.1, 3.9, -0.7, 1.4, 1.2, 1.4);
  },
  bush(g, m = 'bush') {
    part(g, 'ico0', m, 0, 0.5, 0, 1.3, 1.0, 1.3, rnd(0, 1), 0, rnd(0, 1));
    part(g, 'ico0', m, 0.8, 0.4, 0.3, 0.9, 0.7, 0.9, 0, rnd(0, 1), rnd(0, 1));
  },
  rock(g) { part(g, 'dodec', 'rock', 0, 0.25, 0, 1.2, 0.7, 1.0, rnd(0, 0.6), 0, rnd(0, 0.6)); },
  tuft(g, m = 'grass') {
    for (let i = 0; i < 4; i++) part(g, 'tuft', m, rnd(-0.3, 0.3), 0.45, rnd(-0.3, 0.3), 0.18, 1.0, 0.18, rnd(-0.4, 0.4), 0, rnd(-0.4, 0.4));
  },
  mushroom(g) {
    part(g, 'cyl', 'mushStem', 0, 0.35, 0, 0.22, 0.7, 0.22);
    part(g, 'sphere', 'mushCap', 0, 0.7, 0, 0.6, 0.35, 0.6);
  },
  palm(g) {
    part(g, 'palmTrunk', 'bark', 0, 0, 0, 1, 1, 1);
    const top = new THREE.Object3D(); top.position.set(2.2, 8, 0); g.add(top);
    for (let i = 0; i < 3; i++) part(top, 'sphere', 'coco', rnd(-0.5, 0.5), -0.4, rnd(-0.5, 0.5), 0.35, 0.35, 0.35);
    const n = 7;
    for (let k = 0; k < n; k++) {
      const spread = new THREE.Object3D(); spread.rotation.y = k * TAU / n + rnd(-0.2, 0.2); top.add(spread);
      const droop = new THREE.Object3D(); droop.rotation.x = rnd(-0.25, 0.1); spread.add(droop);
      part(droop, 'frond', 'palmLeaf', 0, 0, 0, rnd(0.9, 1.2), 1, rnd(0.9, 1.15));
    }
  },
  umbrella(g, i) {
    part(g, 'cyl', 'pole', 0, 1.6, 0, 0.08, 3.2, 0.08);
    part(g, 'cone', 'umb' + i, 0, 3.4, 0, 2.4, 0.8, 2.4);
    part(g, 'box', 'towel' + i, 2.4, 0.06, 0.6, 2.4, 0.1, 1.3, 0, rnd(0, 1), 0);
  },
  shell(g) { part(g, 'sphere', Math.random() < 0.5 ? 'shell' : 'shell2', 0, 0.12, 0, 0.5, 0.25, 0.4); },
  starfish(g) {
    for (let k = 0; k < 5; k++) { const a = k * TAU / 5; part(g, 'box', 'star', Math.sin(a) * 0.3, 0.08, Math.cos(a) * 0.3, 0.22, 0.14, 0.75, 0, a, 0); }
  },
  crystal(g) {
    const m = Math.random() < 0.5 ? 'crystalA' : 'crystalB';
    for (let i = 0; i < 3; i++) { const sy = rnd(1.3, 2.6); part(g, 'octa', m, rnd(-0.7, 0.7), sy * 0.7, rnd(-0.7, 0.7), 0.45, sy, 0.45, rnd(-0.3, 0.3), rnd(0, TAU), rnd(-0.3, 0.3)); }
  },
  moonRock(g) { part(g, 'dodec', 'moonRock', 0, 0.25, 0, 1.2, 0.7, 1.0, rnd(0, 0.6), 0, rnd(0, 0.6)); },
  alienPlant(g) {
    part(g, 'cyl', 'stalk', 0, 1.2, 0, 0.12, 2.4, 0.12, rnd(-0.2, 0.2), 0, rnd(-0.2, 0.2));
    part(g, 'sphere', 'bulb', 0, 2.6, 0, 0.55, 0.55, 0.55);
  },
  rocket(g) {
    g.rotation.z = rnd(0.25, 0.45);
    part(g, 'cyl', 'rocketBody', 0, 2.5, 0, 0.9, 5, 0.9);
    part(g, 'cone', 'rocketNose', 0, 5.8, 0, 0.9, 1.8, 0.9);
    for (let k = 0; k < 3; k++) { const a = k * TAU / 3; part(g, 'box', 'rocketNose', Math.sin(a) * 0.9, 0.7, Math.cos(a) * 0.9, 0.15, 1.4, 0.9, 0, a, 0); }
  },
  flag(g) {
    part(g, 'cyl', 'flagPole', 0, 1.5, 0, 0.05, 3, 0.05);
    part(g, 'box', 'flag', 0.6, 2.6, 0, 1.2, 0.7, 0.05);
  },
  cloud(g) {
    const n = 3 + Math.floor(Math.random() * 3);

    const g = this.env(t, 0.1, 0.11, 0.3, 0.08, dur * 0.95, 0.25);
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100; lp.connect(g);
    this.osc('sawtooth', f, t, t + dur + 0.4, lp, -7); this.osc('sawtooth', f, t, t + dur + 0.4, lp, 7);
    this.osc('sine', f / 2, t, t + dur + 0.4, this.env(t, 0.1, 0.1, 0.3, 0.08, dur * 0.95, 0.25));
  },
  osc(type, f, t, end, dest, detune = 0) {
    const o = this.ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = detune;
    o.connect(dest); o.start(t); o.stop(end); return o;
  },
  lead(n, t, dur) {
    const f = this.freq(n);
    if (this.track.style === 'chip') {
      const g = this.env(t, 0.01, 0.13, 0.08, 0.07, dur * 0.85, 0.05);
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200; lp.connect(g);
      this.osc('square', f, t, t + dur + 0.1, lp);
    } else if (this.track.style === 'space') {
      const g = this.env(t, 0.25, 0.09, 0.3, 0.07, dur * 0.9, 0.4, this.echoIn);
      this.osc('sine', f, t, t + dur + 0.6, g); this.osc('triangle', f * 2, t, t + dur + 0.6, g, 4);
    } else this.bell(f, t, 0.16);
  },
  bell(f, t, vol) {
    const g = this.env(t, 0.004, vol, 1.4, 0.0001, 1.4, 0.1);
    this.osc('sine', f, t, t + 1.6, g);
    const g2 = this.env(t, 0.004, vol * 0.35, 0.5, 0.0001, 0.5, 0.1);
    this.osc('sine', f * 2.76, t, t + 0.7, g2);
    const g3 = this.env(t, 0.004, vol * 0.5, 0.9, 0.0001, 0.9, 0.1);
    this.osc('triangle', f * 2, t, t + 1.1, g3);
  },
  bass(n, t, dur) {
    if (this.track.style === 'space') {
      this.osc('sine', this.freq(n), t, t + dur + 0.1, this.env(t, 0.01, 0.16, 0.15, 0.02, dur * 0.6, 0.05));
      this.osc('triangle', this.freq(n), t, t + dur + 0.1, this.env(t, 0.01, 0.05, 0.1, 0.01, dur * 0.5, 0.05));
      return;
    }
    const g = this.env(t, 0.01, 0.22, 0.1, 0.12, dur * 0.8, 0.05);
    this.osc('triangle', this.freq(n), t, t + dur + 0.1, g);
  },
  hat(t) {
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const hp = this.ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    const g = this.env(t, 0.002, 0.05, 0.04, 0.0001, 0.04, 0.02); src.connect(hp); hp.connect(g); src.start(t); src.stop(t + 0.1);
  },
  chord(ch, t, dur) {
    const space = this.track.style === 'space';
    // soft pad
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = space ? 420 : 700;
    const g = this.env(t, space ? 0.8 : 0.25, space ? 0.045 : 0.035, 0.3, space ? 0.04 : 0.03, dur, space ? 1.0 : 0.4); lp.connect(g);
    for (const n of ch.slice(0, 3)) { this.osc('sawtooth', this.freq(n), t, t + dur + 0.5, lp, -6); this.osc('sawtooth', this.freq(n), t, t + dur + 0.5, lp, 6); }
    if (space) {
      const step = dur / 4;
      for (let k = 0; k < 4; k++) if (Math.random() < 0.6) {
        const f = this.freq(ch[(k * 2 + 1) % ch.length] + 24);
        this.osc('sine', f, t + k * step, t + k * step + 0.5, this.env(t + k * step, 0.005, 0.05, 0.3, 0.0001, 0.3, 0.05, this.echoIn));
      }
      return;
    }
    // harp-like arpeggio up and down in 16ths
    const notes = [...ch.map(T), ...ch.slice(1, 3).reverse().map(T)];
    const step = dur / 8;
    for (let k = 0; k < 8; k++) {
      const f = this.freq(notes[k % notes.length] + 12);
      const ag = this.env(t + k * step, 0.003, 0.05, 0.35, 0.0001, 0.35, 0.05);
      this.osc('triangle', f, t + k * step, t + k * step + 0.5, ag);
    }
  },
  pew() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(180, t + 0.14);
    const g = this.env(t, 0.003, 0.08, 0.1, 0.0001, 0.1, 0.05); o.connect(g); o.start(t); o.stop(t + 0.2);
  },
  zap() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 2;
    const g = this.env(t, 0.003, 0.12, 0.15, 0.0001, 0.15, 0.05); src.connect(bp); bp.connect(g); src.start(t); src.stop(t + 0.25);
  },
  powerup() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [60, 64, 67, 72].forEach((n, i) => { const o = this.osc('square', this.freq(n), t + i * 0.07, t + i * 0.07 + 0.12, this.env(t + i * 0.07, 0.005, 0.07, 0.08, 0.0001, 0.08, 0.03)); });
  },
  sparkle() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    [72, 76, 79, 84, 88, 91, 96].forEach((n, i) => this.bell(this.freq(n), t + i * 0.07, 0.12));
  },
};

// ---------------- UI wiring ----------------
const menu = document.getElementById('menu'), over = document.getElementById('over'), hud = document.getElementById('hud');
const scoreEl = document.getElementById('score'), lenEl = document.getElementById('len'), aliveEl = document.getElementById('alive');
const muteBtn = document.getElementById('mute'), musicChk = document.getElementById('musicOn');
const fireBtn = document.getElementById('fire'), fireTEl = document.getElementById('fireT');
fireBtn.addEventListener('pointerdown', e => { e.preventDefault(); fireHeld = true; music.resume(); });
window.addEventListener('pointerup', () => { fireHeld = false; }); window.addEventListener('pointercancel', () => { fireHeld = false; });
muteBtn.addEventListener('click', () => { music.setEnabled(!music.enabled); if (music.enabled) { music.unlock(); music.resume(); } });
musicChk.addEventListener('change', () => music.setEnabled(musicChk.checked));
document.addEventListener('visibilitychange', () => { if (music.ctx) { if (document.hidden) music.ctx.suspend(); else if (state !== 'menu') { music.resume(); music.unlock(); } } });
document.getElementById('again').addEventListener('click', () => { music.unlock(); music.resume(); });
document.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.card').forEach(x => x.classList.remove('sel')); c.classList.add('sel'); world = c.dataset.world;
}));
const cpuIn = document.getElementById('cpu');
cpuIn.addEventListener('input', () => { cpuCount = +cpuIn.value; document.getElementById('cpuVal').textContent = cpuIn.value; });
document.getElementById('play').addEventListener('click', startGame);
document.getElementById('again').addEventListener('click', startGame);
document.getElementById('toMenu').addEventListener('click', () => { over.classList.add('hidden'); hud.classList.add('hidden'); muteBtn.classList.add('hidden'); fireBtn.classList.add('hidden'); menu.classList.remove('hidden'); state = 'menu'; music.stop(); });

const NO_MUSIC = new URLSearchParams(location.search).has('nomusic');

// ---------------- renderer / loop ----------------
renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 600);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
clock = new THREE.Clock();

// menu backdrop: an idle world with a slowly orbiting camera
buildWorld();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); time += dt;
  if (state === 'menu') {
    const a = time * 0.08;
    camera.position.set(Math.sin(a) * 60, 22, Math.cos(a) * 60); camera.lookAt(0, 4, 0);
    if (cloudMesh) cloudMesh.rotation.y += dt * 0.004;
    animateUfos(dt); lavaTex.offset.x += dt * 0.03;
  } else step(dt);
  renderer.render(scene, camera);
}
animate();

// ?play=forest|beach&cpu=N starts a game immediately (handy for testing)
{
  const q = new URLSearchParams(location.search);
  if (q.get('play')) {
    if (WORLDS[q.get('play')]) world = q.get('play');
    if (q.get('cpu') !== null) cpuCount = clamp(+q.get('cpu') || 0, 0, 10);
    startGame();
    if (q.get('at') === 'pool' && pools.length) { const p = pools[0]; player.spawn(p.x, p.z + p.r + 14, Math.PI); updateCamera(0, true); }
    if (q.get('unicorn')) player.setUnicorn(true);
    if (q.get('burn')) player.ignite();
    if (q.get('gun')) { player.arm(); player.shoot(); }
  }
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(() => {});
